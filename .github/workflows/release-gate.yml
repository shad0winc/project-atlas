name: Atlas Release Gate

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ATLAS_PROJECT_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install core test dependency
        run: python -m pip install 'pytest>=8.3,<10.0'
      - name: Compile Atlas Python
        run: python -m compileall -q atlas modules/sports/src tests
      - name: Run core regression
        run: python -m pytest tests/core -q

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and test dependencies
        run: python -m pip install -e './apps/api[test]'
      - name: Compile API
        run: python -m compileall -q apps/api/atlas_api apps/api/tests
      - name: Run API regression
        run: python -m pytest apps/api/tests -q

  sports:
    name: Sports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Sports runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Compile Sports
        run: python -m compileall -q modules/sports/src modules/sports/tests
      - name: Run Sports integration suite
        env:
          SPORTS_MEDIA_DIR: ${{ runner.temp }}/atlas-sports/media
          SPORTS_RECORDING_LOG_DIR: ${{ runner.temp }}/atlas-sports/logs
          SPORTS_RECORDINGS_FILE: ${{ runner.temp }}/atlas-sports/recordings/recordings.json
        run: python modules/sports/tests/run_tests.py

  portal:
    name: Portal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - name: Install Portal dependencies
        run: npm ci
      - name: Lint Portal
        run: npm run lint
      - name: Type-check Portal
        run: npm run typecheck
      - name: Test Portal
        run: npm test
      - name: Build Portal
        env:
          ATLAS_API_INTERNAL_URL: http://127.0.0.1:8000
        run: npm run build

  contracts:
    name: Release Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/atlas
          bash -n scripts/update.sh
          bash -n scripts/verify-ingress.sh
          for command in scripts/commands/*.sh; do
            bash -n "$command"
          done
      - name: Reject rollback-destroying update behavior
        shell: bash
        run: |
          set -euo pipefail
          if grep -nF 'docker image prune' \
            scripts/commands/update.sh scripts/update.sh; then
            echo 'ERROR: deployment path prunes rollback images.' >&2
            exit 1
          fi
          grep -qF 'up -d --no-build --pull never' \
            scripts/commands/deployment.sh
          grep -qF 'atlas_deployment_validate_source' \
            scripts/commands/update.sh

  release-gate:
    name: release-gate
    if: ${{ always() }}
    needs:
      - core
      - api
      - sports
      - portal
      - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every release validation surface
        env:
          CORE_RESULT: ${{ needs.core.result }}
          API_RESULT: ${{ needs.api.result }}
          SPORTS_RESULT: ${{ needs.sports.result }}
          PORTAL_RESULT: ${{ needs.portal.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$CORE_RESULT" \
            "$API_RESULT" \
            "$SPORTS_RESULT" \
            "$PORTAL_RESULT" \
            "$CONTRACTS_RESULT"
          do
            [[ "$result" == 'success' ]] || {
              echo "ERROR: release validation result is $result" >&2
              exit 1
            }
          done
          echo 'Atlas release gate: PASS'
