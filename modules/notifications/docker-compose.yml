services:
  atlas-notifications-worker:
    build:
      context: ../..
      dockerfile: modules/notifications/Dockerfile
      args:
        PUID: "${PUID:?PUID is required}"
        PGID: "${PGID:?PGID is required}"

    container_name: atlas-notifications-worker
    restart: unless-stopped

    env_file:
      - .env

    environment:
      ATLAS_NOTIFICATIONS_INTERVAL: "5"

    volumes:
      - /opt/project-atlas:/opt/project-atlas:ro
      - /mnt/storage/configs/atlas/runtime/events.jsonl:/mnt/storage/configs/atlas/runtime/events.jsonl:ro
      - /mnt/storage/configs/atlas/runtime/subscribers/module-notifications.cursor:/mnt/storage/configs/atlas/runtime/subscribers/module-notifications.cursor
      - /mnt/storage/configs/atlas/runtime/subscribers/module-notifications.filter:/mnt/storage/configs/atlas/runtime/subscribers/module-notifications.filter:ro
      - /mnt/storage/configs/atlas/notifications:/mnt/storage/configs/atlas/notifications

    security_opt:
      - no-new-privileges:true

    mem_limit: 128m
    cpus: 0.50

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /mnt/storage/configs/atlas/notifications/worker-heartbeat
          && test
          $(( $(date +%s) - $(stat -c %Y /mnt/storage/configs/atlas/notifications/worker-heartbeat) ))
          -lt 30
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

    labels:
      project-atlas.module: notifications
      project-atlas.service: notifications-worker

    networks:
      - atlas

networks:
  atlas:
    external: true
