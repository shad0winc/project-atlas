services:
  atlas-dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr@sha256:e764cd3fb3a4b14e0c96eeb830cce645b44ef0a2494838e21462c71dde5abeb4
    container_name: atlas-dispatcharr
    restart: unless-stopped

    environment:
      TZ: "${SPORTS_BACKEND_TIMEZONE:-America/New_York}"
      DISPATCHARR_ENV: "aio"

    volumes:
      - "${DISPATCHARR_DATA_DIR:-/mnt/storage/configs/dispatcharr}:/data"

    security_opt:
      - no-new-privileges:true

    mem_limit: 2g
    cpus: 2.00

    networks:
      - atlas

    labels:
      project-atlas.module: sports-backend
      project-atlas.service: dispatcharr

  atlas-teamarr:
    image: ghcr.io/pharaoh-labs/teamarr@sha256:d846ec078cde27f68e94f5fc3eec7f1ec29eca11f653b157ac352fef84b73c0c
    container_name: atlas-teamarr
    restart: unless-stopped

    environment:
      TZ: "${SPORTS_BACKEND_TIMEZONE:-America/New_York}"

    volumes:
      - "${TEAMARR_DATA_DIR:-/mnt/storage/configs/teamarr}:/app/data"

    security_opt:
      - no-new-privileges:true

    mem_limit: 1g
    cpus: 1.00

    networks:
      - atlas

    depends_on:
      - atlas-dispatcharr

    labels:
      project-atlas.module: sports-backend
      project-atlas.service: teamarr

networks:
  atlas:
    external: true
