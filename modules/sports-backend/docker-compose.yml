services:
  atlas-dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr@sha256:e764cd3fb3a4b14e0c96eeb830cce645b44ef0a2494838e21462c71dde5abeb4
    container_name: atlas-dispatcharr
    restart: unless-stopped

    environment:
      TZ: "${SPORTS_BACKEND_TIMEZONE:-America/New_York}"
      DISPATCHARR_ENV: "aio"
      # Xtream provider URLs and account identifiers may be
      # present in upstream INFO/DEBUG messages. Atlas keeps
      # unattended Dispatcharr below those verbosity levels.
      DISPATCHARR_LOG_LEVEL: "WARNING"

    volumes:
      - "${DISPATCHARR_DATA_DIR:-/mnt/storage/configs/dispatcharr}:/data"

    security_opt:
      - no-new-privileges:true

    mem_limit: 2g
    cpus: 2.00

    networks:
      - atlas

    labels:
      project-atlas.module: sports-backend
      project-atlas.service: dispatcharr

  atlas-teamarr:
    build:
      context: ../..
      dockerfile: modules/sports-backend/teamarr/Dockerfile
    image: project-atlas/teamarr:2.15.0-atlas3
    container_name: atlas-teamarr
    restart: unless-stopped

    environment:
      TZ: "${SPORTS_BACKEND_TIMEZONE:-America/New_York}"

    volumes:
      - "${TEAMARR_DATA_DIR:-/mnt/storage/configs/teamarr}:/app/data"

    security_opt:
      - no-new-privileges:true

    mem_limit: 1g
    cpus: 1.00

    networks:
      - atlas

    depends_on:
      - atlas-dispatcharr

    labels:
      project-atlas.module: sports-backend
      project-atlas.service: teamarr

networks:
  atlas:
    external: true
