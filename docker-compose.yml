name: project-atlas

networks:
  atlas:
    name: atlas
    driver: bridge

  atlas-backend:
    name: atlas-backend
    external: true
  atlas-identity:
    name: atlas-identity
    driver: bridge

  atlas-indexer-proxy:
    name: atlas-indexer-proxy
    driver: bridge

  atlas-docker-api:
    name: atlas-docker-api
    driver: bridge
    internal: true

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    networks:
      - atlas
      - atlas-identity
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ${CONFIG}/jellyfin:/config
      - ${CONFIG}/jellyfin-cache:/cache
      - ${MEDIA}:/media
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "104"
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - atlas
      - atlas-indexer-proxy
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/prowlarr:/config
    restart: unless-stopped


  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    networks:
      - atlas-indexer-proxy
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks: [atlas]
    ports:
      - "${SONARR_PORT:-8989}:8989"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/sonarr:/config
      - ${MEDIA}:/media
      - ${DOWNLOADS}:/downloads
    restart: unless-stopped

  sonarr-anime:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr-anime
    networks: [atlas]
    ports:
      - "${SONARR_ANIME_PORT:-8990}:8989"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/sonarr-anime:/config
      - ${MEDIA}:/media
      - ${DOWNLOADS}:/downloads
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks: [atlas]
    ports:
      - "${RADARR_PORT:-7878}:7878"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/radarr:/config
      - ${MEDIA}:/media
      - ${DOWNLOADS}:/downloads
    restart: unless-stopped

  radarr-anime:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-anime
    networks: [atlas]
    ports:
      - "${RADARR_ANIME_PORT:-7879}:7878"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/radarr-anime:/config
      - ${MEDIA}:/media
      - ${DOWNLOADS}:/downloads
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks: [atlas]
    ports:
      - "${QBITTORRENT_PORT:-8080}:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - VPN_SERVICE_PROVIDER=windscribe
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${WINDSCRIBE_USER}
      - OPENVPN_PASSWORD=${WINDSCRIBE_PASSWORD}
      - SERVER_REGIONS=${VPN_REGION}
      - TZ=${TZ}
      - FIREWALL=on
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 1
      start_period: 10s
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG}/qbittorrent:/config
      - ${DOWNLOADS}:/downloads
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
    init: true
    container_name: jellyseerr
    networks:
      - atlas
      - atlas-backend
    ports:
      - "${JELLYSEERR_PORT:-5055}:5055"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/jellyseerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    depends_on:
      - jellyfin
      - sonarr
      - radarr

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks: [atlas]
    ports:
      - "${BAZARR_PORT:-6767}:6767"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/bazarr:/config
      - ${MEDIA}:/media
    restart: unless-stopped

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:3.21.1@sha256:811a580fdf479e8582d3c97047b1aa8930fc5523f63143498020864ad6a7cd80
    container_name: maintainerr
    user: "1000:1000"
    networks: [atlas]
    ports:
      - "${MAINTAINERR_PORT:-6246}:6246"
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/maintainerr:/opt/data
      - ${MEDIA}:/media
    restart: unless-stopped
    depends_on:
      - jellyfin
      - radarr
      - sonarr

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    networks: [atlas]
    ports:
      - "${TAUTULLI_PORT:-8181}:8181"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/tautulli:/config
    restart: unless-stopped
    depends_on:
      - jellyfin

  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    networks: [atlas]

    profiles:
      - advanced

    environment:
      - TZ=${TZ}
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=REPLACE_AFTER_SETUP
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=REPLACE_AFTER_SETUP
      - UN_FOLDER_0_PATH=/downloads
      - UN_FOLDER_0_EXTRACT_PATH=/downloads/complete
      - UN_FOLDER_0_DELETE_AFTER=10m
    volumes:
      - ${DOWNLOADS}:/downloads
    restart: unless-stopped
    depends_on:
      - sonarr
      - radarr

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    networks: [atlas]
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - SONARR_ANIME_API_KEY=${SONARR_ANIME_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - RADARR_ANIME_API_KEY=${RADARR_ANIME_API_KEY}
    volumes:
      - ${CONFIG}/recyclarr:/config
    profiles:
      - manual
    depends_on:
      - sonarr
      - radarr

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    networks: [atlas]
    ports:
      - "${HOMEPAGE_PORT:-3000}:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/homepage:/app/config
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    networks:
      - atlas
      - atlas-docker-api
    ports:
      - "${DOZZLE_PORT:-9999}:8080"
    environment:
      - DOZZLE_REMOTE_HOST=tcp://atlas-docker-socket-proxy:2375
    restart: unless-stopped

  atlas-docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: atlas-docker-socket-proxy
    networks:
      - atlas-docker-api
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - INFO=1
      - PING=1
      - VERSION=1
      - POST=0
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
      - LOG_LEVEL=warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
