<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Project Atlas by ShadowInc">
  <title>Atlas Platform | ShadowInc</title>
  <style>
    :root {
      color-scheme: dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #080b12;
      color: #f4f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at top, #172238 0, transparent 44%),
        linear-gradient(145deg, #080b12 0%, #0d1320 100%);
    }

    main {
      width: min(760px, 100%);
      padding: clamp(2rem, 6vw, 4.5rem);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.5rem;
      background: rgba(12, 17, 29, 0.88);
      box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .brand {
      margin: 0 0 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #aab9d3;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    .tagline {
      margin: 1.5rem 0 0;
      max-width: 34rem;
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      line-height: 1.7;
      color: #c5cfdf;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin-top: 2.25rem;
      padding: 0.7rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      color: #d9e4f5;
      background: rgba(255, 255, 255, 0.045);
    }

    .status::before {
      width: 0.65rem;
      height: 0.65rem;
      content: "";
      border-radius: 50%;
      background: #63d69a;
      box-shadow: 0 0 1rem rgba(99, 214, 154, 0.8);
    }

    footer {
      margin-top: 3rem;
      color: #77859d;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">ShadowInc</p>
    <h1>Atlas</h1>

    <p class="tagline">
      Your personal cloud platform for media, automation, intelligence,
      and future ShadowInc services.
    </p>

    <div class="status">Production infrastructure is being prepared</div>

    <footer>atlas.shadowinc.co</footer>
  </main>
</body>
</html>
