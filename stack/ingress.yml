name: atlas-ingress

services:
  portal:
    build:
      context: ../apps/portal
      dockerfile: Dockerfile
    image: atlas-portal:local
    container_name: atlas-portal
    restart: unless-stopped

    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 512

    networks:
      - atlas-ingress

    expose:
      - "3000"

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: atlas-api:local
    container_name: atlas-api
    restart: unless-stopped

    mem_limit: 1024m
    cpus: 2.0
    pids_limit: 512

    networks:
      - atlas-ingress

    expose:
      - "8000"

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: atlas-caddy
    restart: unless-stopped

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --output /dev/null
          --resolve atlas.shadowinc.co:443:127.0.0.1
          https://atlas.shadowinc.co/_atlas/ingress-health
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    depends_on:
      portal:
        condition: service_healthy
      api:
        condition: service_healthy

    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"

    volumes:
      - ../infra/caddy:/etc/caddy:ro
      - /mnt/storage/configs/atlas/maintenance:/etc/atlas-maintenance:ro
      - ../infra/caddy/site:/srv:ro
      - /mnt/storage/configs/atlas/caddy/data:/data
      - /mnt/storage/configs/atlas/caddy/config:/config
      - /mnt/storage/configs/atlas/caddy/logs:/var/log/caddy

    networks:
      - atlas-ingress

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp
      - /run

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  atlas-ingress:
    external: true
    name: atlas-ingress
