name: atlas-ingress

services:
  portal:
    build:
      context: ../apps/portal
      dockerfile: Dockerfile
    image: atlas-portal:local
    container_name: atlas-portal
    restart: unless-stopped

    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 512

    networks:
      - atlas-ingress

    expose:
      - "3000"

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: atlas-api:local
    container_name: atlas-api
    restart: unless-stopped

    mem_limit: 1024m
    cpus: 2.0
    pids_limit: 512

    networks:
      - atlas-ingress
      - atlas-backend
      - atlas-identity

    group_add:
      - "20000"
      - "20001"

    volumes:
      - /mnt/storage/configs/atlas/users:/mnt/storage/configs/atlas/users:ro
      - /mnt/storage/configs/atlas/identity/favorites:/mnt/storage/configs/atlas/identity/favorites:rw
      - /mnt/storage/configs/atlas/runtime/requests:/mnt/storage/configs/atlas/runtime/requests:rw
      - /mnt/storage/configs/atlas/runtime/events.jsonl:/mnt/storage/configs/atlas/runtime/events.jsonl:rw

    expose:
      - "8000"

    environment:
      ATLAS_JELLYFIN_URL: "http://jellyfin:8096"
      ATLAS_JELLYFIN_API_KEY: "${ATLAS_JELLYFIN_API_KEY:?ATLAS_JELLYFIN_API_KEY is required}"
      ATLAS_JELLYSEERR_URL: "http://jellyseerr:5055"
      ATLAS_JELLYSEERR_API_KEY: "${ATLAS_JELLYSEERR_API_KEY:?ATLAS_JELLYSEERR_API_KEY is required}"
      ATLAS_REQUESTS_DIR: "/mnt/storage/configs/atlas/runtime/requests"
      ATLAS_USERS_DIR: "/mnt/storage/configs/atlas/users"
      ATLAS_SECURITY_AUDIT_PATH: "/mnt/storage/configs/atlas/runtime/events.jsonl"
      ATLAS_JWT_SECRET: "${ATLAS_JWT_SECRET:?ATLAS_JWT_SECRET is required}"
      ATLAS_JWT_ISSUER: "${ATLAS_JWT_ISSUER:-project-atlas}"
      ATLAS_JWT_AUDIENCE: "${ATLAS_JWT_AUDIENCE:-atlas-portal}"
      ATLAS_ACCESS_TOKEN_MINUTES: "${ATLAS_ACCESS_TOKEN_MINUTES:-15}"
      ATLAS_REFRESH_TOKEN_DAYS: "${ATLAS_REFRESH_TOKEN_DAYS:-30}"

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: atlas-caddy
    restart: unless-stopped

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --output /dev/null
          --resolve atlas.shadowinc.co:443:127.0.0.1
          https://atlas.shadowinc.co/_atlas/ingress-health
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    depends_on:
      portal:
        condition: service_healthy
      api:
        condition: service_healthy

    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"

    volumes:
      - ../infra/caddy:/etc/caddy:ro
      - /mnt/storage/configs/atlas/maintenance:/etc/atlas-maintenance:ro
      - ../infra/caddy/site:/srv:ro
      - /mnt/storage/configs/atlas/caddy/data:/data
      - /mnt/storage/configs/atlas/caddy/config:/config
      - /mnt/storage/configs/atlas/caddy/logs:/var/log/caddy

    networks:
      - atlas-ingress

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp
      - /run

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  atlas-ingress:
    external: true
    name: atlas-ingress
  atlas-backend:
    external: true
    name: atlas-backend
  atlas-identity:
    external: true
    name: atlas-identity
