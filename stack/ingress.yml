name: atlas-ingress

services:
  portal:
    build:
      context: ../apps/portal
      dockerfile: Dockerfile
    image: atlas-portal:local
    container_name: atlas-portal
    restart: unless-stopped

    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 512

    networks:
      - atlas-ingress

    expose:
      - "3000"

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: atlas-api:local
    container_name: atlas-api
    restart: unless-stopped

    mem_limit: 1024m
    cpus: 2.0
    pids_limit: 512

    networks:
      - atlas-ingress
      - atlas-backend
      - atlas-identity

    group_add:
      - "20000"
      - "20001"

    volumes:
      - /mnt/storage/configs/atlas/users:/mnt/storage/configs/atlas/users:ro
      - /mnt/storage/configs/atlas/identity/invitations:/mnt/storage/configs/atlas/identity/invitations:ro
      - /mnt/storage/configs/atlas/identity/custom_roles:/mnt/storage/configs/atlas/identity/custom_roles:ro
      - /mnt/storage/configs/atlas/identity/favorites:/mnt/storage/configs/atlas/identity/favorites:rw
      - /mnt/storage/configs/atlas/runtime/requests:/mnt/storage/configs/atlas/runtime/requests:rw
      - /mnt/storage/configs/atlas/runtime/events.jsonl:/mnt/storage/configs/atlas/runtime/events.jsonl:rw
      - /mnt/storage/configs/atlas/runtime/ari:/mnt/storage/configs/atlas/runtime/ari:ro
      - /mnt/storage/configs/atlas/runtime/services:/mnt/storage/configs/atlas/runtime/services:ro
      - /mnt/storage/configs/atlas/runtime/dashboard:/mnt/storage/configs/atlas/runtime/dashboard:ro
      - /mnt/storage/configs/atlas/runtime/downloads:/mnt/storage/configs/atlas/runtime/downloads:ro

    expose:
      - "8000"

    environment:
      ATLAS_JELLYFIN_URL: "http://jellyfin:8096"
      ATLAS_JELLYFIN_PUBLIC_URL: "https://jellyfin.shadowinc.co"
      ATLAS_JELLYFIN_API_KEY: "${ATLAS_JELLYFIN_API_KEY:?ATLAS_JELLYFIN_API_KEY is required}"
      ATLAS_JELLYSEERR_URL: "http://jellyseerr:5055"
      ATLAS_JELLYSEERR_API_KEY: "${ATLAS_JELLYSEERR_API_KEY:?ATLAS_JELLYSEERR_API_KEY is required}"
      ATLAS_JELLYSEERR_MOVIE_SERVER_ID: "${ATLAS_JELLYSEERR_MOVIE_SERVER_ID:-}"
      ATLAS_JELLYSEERR_TV_SERVER_ID: "${ATLAS_JELLYSEERR_TV_SERVER_ID:-}"
      ATLAS_JELLYSEERR_ANIME_MOVIE_SERVER_ID: "${ATLAS_JELLYSEERR_ANIME_MOVIE_SERVER_ID:-}"
      ATLAS_JELLYSEERR_ANIME_TV_SERVER_ID: "${ATLAS_JELLYSEERR_ANIME_TV_SERVER_ID:-}"
      ATLAS_REQUESTS_DIR: "/mnt/storage/configs/atlas/runtime/requests"
      ATLAS_USERS_DIR: "/mnt/storage/configs/atlas/users"
      ATLAS_CUSTOM_ROLES_PATH: "/mnt/storage/configs/atlas/identity/custom_roles/custom_roles.json"
      ATLAS_IDENTITY_WRITER_URL: "http://identity-writer:8001"
      ATLAS_IDENTITY_WRITER_TOKEN: "${ATLAS_IDENTITY_WRITER_TOKEN:?ATLAS_IDENTITY_WRITER_TOKEN is required}"
      ATLAS_DOWNLOADS_WRITER_URL: "http://downloads-writer:8002"
      ATLAS_DOWNLOADS_WRITER_TOKEN: "${ATLAS_DOWNLOADS_WRITER_TOKEN:?ATLAS_DOWNLOADS_WRITER_TOKEN is required}"
      ATLAS_SPORTS_WRITER_URL: "http://sports-writer:8003"
      ATLAS_SPORTS_WRITER_TOKEN: "${ATLAS_SPORTS_WRITER_TOKEN:?ATLAS_SPORTS_WRITER_TOKEN is required}"
      ATLAS_SECURITY_AUDIT_PATH: "/mnt/storage/configs/atlas/runtime/events.jsonl"
      ATLAS_ARI_LATEST_FILE: "/mnt/storage/configs/atlas/runtime/ari/latest.json"
      ATLAS_ARI_LATEST_PATH: "/mnt/storage/configs/atlas/runtime/ari/latest.json"
      ATLAS_SERVICE_LIFECYCLE_SNAPSHOT_PATH: "/mnt/storage/configs/atlas/runtime/services/latest.json"
      ATLAS_DOWNLOADS_SNAPSHOT_PATH: "/mnt/storage/configs/atlas/runtime/downloads/latest.json"
      ATLAS_DASHBOARD_HEALTH_SNAPSHOT_PATH: "/mnt/storage/configs/atlas/runtime/dashboard/health.json"
      ATLAS_DASHBOARD_SCHEDULER_SNAPSHOT_PATH: "/mnt/storage/configs/atlas/runtime/dashboard/scheduler.json"
      ATLAS_DASHBOARD_OPERATIONS_DIRECTORY: "/mnt/storage/configs/atlas/runtime/dashboard/operations/current"
      ATLAS_JWT_SECRET: "${ATLAS_JWT_SECRET:?ATLAS_JWT_SECRET is required}"
      ATLAS_JWT_ISSUER: "${ATLAS_JWT_ISSUER:-project-atlas}"
      ATLAS_JWT_AUDIENCE: "${ATLAS_JWT_AUDIENCE:-atlas-portal}"
      ATLAS_ACCESS_TOKEN_MINUTES: "${ATLAS_ACCESS_TOKEN_MINUTES:-15}"
      ATLAS_REFRESH_TOKEN_DAYS: "${ATLAS_REFRESH_TOKEN_DAYS:-30}"

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  downloads-writer:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: atlas-api:local
    container_name: atlas-downloads-writer
    restart: unless-stopped

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

    networks:
      - atlas-identity

    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "8002"

    environment:
      ATLAS_DOWNLOADS_WRITER_TOKEN: "${ATLAS_DOWNLOADS_WRITER_TOKEN:?ATLAS_DOWNLOADS_WRITER_TOKEN is required}"
      ATLAS_DOWNLOADS_JOB_ID_KEY: "${ATLAS_DOWNLOADS_JOB_ID_KEY:?ATLAS_DOWNLOADS_JOB_ID_KEY is required}"
      ATLAS_QBITTORRENT_BASE_URL: "http://host.docker.internal:8080"
      ATLAS_QBITTORRENT_USERNAME: "${ATLAS_QBITTORRENT_USERNAME:?ATLAS_QBITTORRENT_USERNAME is required}"
      ATLAS_QBITTORRENT_PASSWORD: "${ATLAS_QBITTORRENT_PASSWORD:?ATLAS_QBITTORRENT_PASSWORD is required}"

    command:
      - python
      - -m
      - atlas_api.downloads_writer
      - --host
      - "0.0.0.0"
      - --port
      - "8002"

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  sports-writer:
    build:
      context: ..
      dockerfile: modules/sports/Dockerfile.private-api
      args:
        PUID: "${PUID:?PUID is required}"
        PGID: "${PGID:?PGID is required}"
    image: atlas-sports-writer:local
    container_name: atlas-sports-writer
    restart: unless-stopped
    read_only: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    networks:
      - atlas-identity
    volumes:
      - /mnt/storage/configs/sportyfin/state:/mnt/storage/configs/sportyfin/state:rw
    expose:
      - "8003"
    environment:
      ATLAS_SPORTS_WRITER_TOKEN: "${ATLAS_SPORTS_WRITER_TOKEN:?ATLAS_SPORTS_WRITER_TOKEN is required}"
      SPORTS_SUBSCRIPTIONS_FILE: "${SPORTS_SUBSCRIPTIONS_FILE:-/mnt/storage/configs/sportyfin/state/subscriptions.json}"
      SPORTS_THESPORTSDB_API_KEY: "${SPORTS_THESPORTSDB_API_KEY:?SPORTS_THESPORTSDB_API_KEY is required}"
      SPORTS_DISCOVERY_DAYS_AHEAD: "${SPORTS_DISCOVERY_DAYS_AHEAD:?SPORTS_DISCOVERY_DAYS_AHEAD is required}"
      SPORTS_THESPORTSDB_LEAGUE_IDS: "${SPORTS_THESPORTSDB_LEAGUE_IDS:?SPORTS_THESPORTSDB_LEAGUE_IDS is required}"
      SPORTS_PROVIDER_TIMEOUT_SECONDS: "${SPORTS_PROVIDER_TIMEOUT_SECONDS:?SPORTS_PROVIDER_TIMEOUT_SECONDS is required}"
      SPORTS_PROVIDER_REQUEST_BUDGET_FILE: "${SPORTS_PROVIDER_REQUEST_BUDGET_FILE:-/mnt/storage/configs/sportyfin/state/provider-request-budget.json}"
    command:
      - python3
      - /srv/sports/private_api.py
      - --host
      - "0.0.0.0"
      - --port
      - "8003"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  identity-writer:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: atlas-api:local
    container_name: atlas-identity-writer
    restart: unless-stopped

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

    networks:
      - atlas-identity

    group_add:
      - "20000"
      - "20001"

    volumes:
      - /mnt/storage/configs/atlas/users:/mnt/storage/configs/atlas/users:rw
      - /mnt/storage/configs/atlas/identity/invitations:/mnt/storage/configs/atlas/identity/invitations:rw
      - /mnt/storage/configs/atlas/identity/custom_roles:/mnt/storage/configs/atlas/identity/custom_roles:rw

    expose:
      - "8001"

    environment:
      ATLAS_USERS_DIR: "/mnt/storage/configs/atlas/users"
      ATLAS_IDENTITY_DIR: "/mnt/storage/configs/atlas/identity"
      ATLAS_CUSTOM_ROLES_PATH: "/mnt/storage/configs/atlas/identity/custom_roles/custom_roles.json"
      ATLAS_IDENTITY_WRITER_TOKEN: "${ATLAS_IDENTITY_WRITER_TOKEN:?ATLAS_IDENTITY_WRITER_TOKEN is required}"
      ATLAS_JELLYFIN_URL: "http://jellyfin:8096"
      ATLAS_JELLYFIN_API_KEY: "${ATLAS_JELLYFIN_API_KEY:?ATLAS_JELLYFIN_API_KEY is required}"
      ATLAS_JELLYFIN_TIMEOUT_SECONDS: "${ATLAS_JELLYFIN_TIMEOUT_SECONDS:-10}"

    command:
      - python
      - -m
      - atlas_api.identity_writer
      - --host
      - "0.0.0.0"
      - --port
      - "8001"

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: atlas-caddy
    restart: unless-stopped

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --output /dev/null
          --resolve atlas.shadowinc.co:443:127.0.0.1
          https://atlas.shadowinc.co/_atlas/ingress-health
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    depends_on:
      portal:
        condition: service_healthy
      api:
        condition: service_healthy

    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"

    volumes:
      - ../infra/caddy:/etc/caddy:ro
      - /mnt/storage/configs/atlas/maintenance:/etc/atlas-maintenance:ro
      - ../infra/caddy/site:/srv:ro
      - /mnt/storage/configs/atlas/caddy/data:/data
      - /mnt/storage/configs/atlas/caddy/config:/config
      - /mnt/storage/configs/atlas/caddy/logs:/var/log/caddy

    networks:
      - atlas-ingress

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp
      - /run

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  atlas-ingress:
    external: true
    name: atlas-ingress
  atlas-backend:
    external: true
    name: atlas-backend
  atlas-identity:
    external: true
    name: atlas-identity
