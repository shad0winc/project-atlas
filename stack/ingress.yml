name: atlas-ingress

services:
  caddy:
    image: caddy:2-alpine
    container_name: atlas-caddy
    restart: unless-stopped

    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"

    volumes:
      - ../infra/caddy:/etc/caddy:ro
      - ../infra/caddy/site:/srv:ro
      - /mnt/storage/configs/atlas/caddy/data:/data
      - /mnt/storage/configs/atlas/caddy/config:/config
      - /mnt/storage/configs/atlas/caddy/logs:/var/log/caddy

    networks:
      - atlas-ingress

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp
      - /run

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  atlas-ingress:
    external: true
    name: atlas-ingress
